<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Side Out Spot - Court Reservation</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background-color: #fce7f3;
      font-family: Arial, sans-serif;
      padding: 16px;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background-color: #fbcfe8;
      border: 4px solid #f472b6;
      border-radius: 24px;
      padding: 20px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      box-sizing: border-box;
    }
    .title {
      text-align: center;
      font-size: 26px;
      font-weight: 900;
      font-style: italic;
      color: #0d9488;
      margin: 0;
    }
    .subtitle {
      text-align: center;
      font-size: 11px;
      font-weight: bold;
      color: #db2777;
      margin: 2px 0 16px 0;
      text-transform: uppercase;
    }
    .banner {
      background-color: rgba(255, 255, 255, 0.9);
      padding: 10px;
      border-radius: 12px;
      font-size: 12px;
      text-align: center;
      margin-bottom: 16px;
      border: 1px solid #f472b6;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 6px;
      color: #334155;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }
    .option-btn {
      background-color: #ffffff;
      border: 2px solid #f472b6;
      border-radius: 10px;
      padding: 8px 4px;
      font-weight: bold;
      font-size: 10px;
      color: #334155;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .option-btn:hover {
      background-color: #fdf2f8;
    }
    .selected {
      background-color: #0d9488 !important;
      color: #ffffff !important;
      border-color: #0f766e !important;
    }
    .booked-btn {
      background-color: #cbd5e1 !important;
      color: #94a3b8 !important;
      border-color: #94a3b8 !important;
      cursor: not-allowed !important;
      text-decoration: line-through;
    }
    input[type="date"], input[type="text"], input[type="tel"], input[type="file"] {
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      border: 2px solid #f472b6;
      background-color: #ffffff;
      font-size: 13px;
      box-sizing: border-box;
      margin-bottom: 12px;
    }
    .summary-box {
      background-color: rgba(255, 255, 255, 0.9);
      padding: 10px;
      border-radius: 12px;
      border: 1px solid #f472b6;
      font-size: 12px;
      margin-bottom: 12px;
    }
    .submit-btn {
      width: 100%;
      background-color: #0d9488;
      color: #ffffff;
      font-weight: bold;
      padding: 12px;
      border-radius: 12px;
      border: none;
      font-size: 14px;
      cursor: pointer;
    }
    .submit-btn:hover {
      background-color: #0f766e;
    }
    .hidden {
      display: none;
    }
    .court-section-title {
      font-size: 11px;
      font-weight: bold;
      color: #0d9488;
      margin-top: 8px;
      margin-bottom: 4px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1 class="title">SIDE OUT SPOT</h1>
    <p class="subtitle">Court Reservation</p>

    <div class="banner">
      <strong style="color: #0d9488;">Rates:</strong><br>
      ₱350 | 03:00 PM - 05:00 PM<br>
      ₱450 | 05:00 PM - 12:00 AM
    </div>

    <form id="step1Form">
      
      <label>Court Number (Select Courts):</label>
      <div class="grid-2">
        <button type="button" class="option-btn" style="font-size: 12px; padding: 10px;" onclick="toggleCourt(this, 'Court 1')">Court 1</button>
        <button type="button" class="option-btn" style="font-size: 12px; padding: 10px;" onclick="toggleCourt(this, 'Court 2')">Court 2</button>
      </div>

      <label>Date (PHT):</label>
      <input type="date" id="bookingDate" required onchange="onDateOrCourtChange()">

      <div id="timeSlotsContainer">
        <p style="font-size: 11px; color: #64748b; font-style: italic; margin-bottom: 12px;">Please select a court above to view time slots.</p>
      </div>

      <label>Player Details:</label>
      <input type="text" id="playerName" placeholder="Name" required>
      <input type="tel" id="playerMobile" placeholder="Contact Number" required>

      <div class="summary-box">
        <strong style="color: #0d9488;">Booking Summary:</strong>
        <div id="summaryText">Selected: 0 Slot(s)</div>
        <div style="font-size: 15px; font-weight: bold; margin-top: 4px;">Total: <span id="totalAmount">₱0</span></div>
      </div>

      <div style="font-size: 11px; margin-bottom: 12px;">
        <input type="checkbox" id="termsCheck" required>
        <label for="termsCheck" style="display: inline; text-transform: none;">Check box for terms
